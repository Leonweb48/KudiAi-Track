name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Supabase secrets
        run: |
          supabase secrets set \
            EMAIL_TRIGGER_SECRET=${{ secrets.EMAIL_TRIGGER_SECRET }} \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: |
          supabase functions deploy email-trigger              --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy clubkonnect         --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy paystack-webhook    --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy ajo-portal                          --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy coop-portal                         --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy manage-staff-account                --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy manage-ajo-client-account           --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy auth-email-hook      --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy whisper                              --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy delete-ajo-client                   --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy initialize-payment                  --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy paystack                            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy peyflex                             --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
