name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      # Deploy all functions and collect failures — one transient error no
      # longer silently blocks every subsequent function from deploying.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          FAILED=""
          REF="${{ secrets.SUPABASE_PROJECT_ID }}"

          deploy() {
            local name="$1"; shift
            echo "▶ Deploying $name…"
            if supabase functions deploy "$name" "$@" --project-ref "$REF"; then
              echo "✓ $name deployed"
            else
              echo "✗ $name FAILED"
              FAILED="$FAILED $name"
            fi
          }

          deploy email-trigger
          deploy clubkonnect          --no-verify-jwt
          deploy paystack-webhook     --no-verify-jwt
          deploy ajo-portal
          deploy ajo-write
          deploy coop-portal
          deploy manage-staff-account
          deploy manage-ajo-client-account
          deploy auth-email-hook      --no-verify-jwt
          deploy whisper
          deploy delete-ajo-client
          deploy initialize-payment
          deploy paystack
          deploy peyflex
          deploy pin-manager
          deploy notify-send
          deploy verify-identity       --no-verify-jwt

          if [ -n "$FAILED" ]; then
            echo ""
            echo "❌ Failed functions:$FAILED"
            exit 1
          fi
          echo ""
          echo "✅ All functions deployed successfully"
