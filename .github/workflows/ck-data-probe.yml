# Which data plans does ClubKonnect refuse right now? Free: each listed plan is sent to phone "0" (never delivered,
# never charged) — an accepted plan gets a phone-number complaint, a refused one INVALID_DATAPLAN. A made-up plan is
# the control. Statuses only in the log.
name: ClubKonnect data plan check

on:
  workflow_dispatch:
    inputs:
      per_network:
        description: "plans to check per network (from the live list)"
        default: "6"
        required: false
      extra:
        description: "extra NETWORK:PLAN pairs, comma-separated (e.g. MTN:1500.02,Glo:500.02)"
        default: "MTN:1500.02,MTN:1000.03,Glo:500.02"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check plans
        env:
          URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PER: ${{ inputs.per_network }}
          EXTRA: ${{ inputs.extra }}
        run: |
          set -uo pipefail
          [[ "$PER" =~ ^[0-9]{1,2}$ ]] || PER=6
          [[ "$EXTRA" =~ ^[A-Za-z0-9:.,]*$ ]] || EXTRA=""
          call() { curl -sS -m 200 -X POST "$URL/functions/v1/clubkonnect" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -d "$1"; }
          for NET in MTN Glo Airtel 9mobile; do
            call "$(jq -nc --arg n "$NET" '{action:"data-plans", network:$n}')" > plans.json
            BODY=$(jq -c --arg n "$NET" --argjson k "$PER" '{action:"data-probe", probes: ([.plans[]? | select(.plan_id | startswith("bg:") | not) | {network:$n, planId:.plan_id, name:.plan_name}] | .[0:$k])}' plans.json)
            jq -r '.probes[] | "  listed: \(.network) \(.planId) = \(.name)"' <<<"$BODY"
            call "$(jq -c '{action, probes: [.probes[] | {network, planId}] + [{network:"MTN", planId:"99999"}]}' <<<"$BODY")" | jq -r '.probes[]? | "\(.network) \(.planId) → \(.status)"' || echo "$NET: no answer"
          done
          if [ -n "$EXTRA" ]; then
            BODY=$(jq -nc --arg e "$EXTRA" '{action:"data-probe", probes: [$e | split(",")[] | select(length>0) | split(":") | {network:.[0], planId:.[1]}]}')
            call "$BODY" | jq -r '.probes[]? | "extra \(.network) \(.planId) → \(.status)"'
          fi
          rm -f plans.json
