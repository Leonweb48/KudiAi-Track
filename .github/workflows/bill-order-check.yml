name: Bill order check

# Asks the provider(s) about ONE bill order by our RequestID (clubkonnect `verify`) — for reconciling an
# "unconfirmed" bill alert. Prints only the verdict (SUCCESS / FAILED / NOT_FOUND / PENDING / UNKNOWN), the provider
# and whether a token/PIN came back. Never prints the provider's reply body, balances or tokens.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Our RequestID, e.g. KDT-BILL-1792484501202"
        required: true
      service:
        description: "airtime, data, cable, electricity, waec, ..."
        required: true
        default: airtime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1 (pinned)
        with:
          version: 2.107.0
      - name: Verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          RID: ${{ inputs.request_id }}
          SVC: ${{ inputs.service }}
        run: |
          set -euo pipefail
          [[ "$RID" =~ ^KDT-[A-Z]+-[0-9A-Za-z-]{6,40}$ ]] || { echo "bad request_id"; exit 1; }
          [[ "$SVC" =~ ^[a-z-]{3,20}$ ]] || { echo "bad service"; exit 1; }
          FN="https://${REF}.supabase.co/functions/v1/clubkonnect"
          SRK=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SRK"
          BODY=$(jq -nc --arg r "$RID" --arg s "$SVC" '{action:"verify", requestId:$r, service:$s}')
          curl -sS -m 90 -o out.json -w "HTTP     %{http_code}
" -X POST "$FN" -H "Content-Type: application/json" -H "Authorization: Bearer $SRK" -d "$BODY" || true
          echo "VERDICT  $(jq -r '.status // "no-status"' out.json 2>/dev/null || echo unreadable)"
          echo "PROVIDER $(jq -r '.provider // "clubkonnect"' out.json 2>/dev/null || true)"
          echo "MESSAGE  $(jq -r '.message // empty' out.json 2>/dev/null | head -c 60 | tr -cd 'A-Za-z0-9 _:.-')"
          echo "HAS_REF  $(jq -r 'if (.reference // "") != "" then "yes" else "no" end' out.json 2>/dev/null || true)"
          echo "HTTP_ERR $(jq -r '.error // empty' out.json 2>/dev/null | head -c 80 | tr -cd 'A-Za-z0-9 _:.,-')"
          echo "KEYS     $(jq -r 'keys | join(",")' out.json 2>/dev/null | head -c 120 || echo not-json)"
