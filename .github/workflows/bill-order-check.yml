name: Bill order check

# Asks the provider(s) about ONE bill order by our RequestID (clubkonnect `verify`) — for reconciling an
# "unconfirmed" bill alert. Prints only the verdict (SUCCESS / FAILED / NOT_FOUND / PENDING / UNKNOWN), the provider
# and whether a token/PIN came back. Never prints the provider's reply body, balances or tokens.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Our RequestID(s), e.g. KDT-BILL-1792484501202 — several separated by spaces or commas"
        required: true
      service:
        description: "airtime, data, cable, electricity, waec, ..."
        required: true
        default: airtime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify
        env:
          URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RID: ${{ inputs.request_id }}
          SVC: ${{ inputs.service }}
        run: |
          set -euo pipefail
          [[ "$SVC" =~ ^[a-z-]{3,20}$ ]] || { echo "bad service"; exit 1; }
          # the function compares the bearer with the service key it was deployed with (same secret as bill-charge-sweep)
          for one in $(echo "$RID" | tr ',' ' '); do
            [[ "$one" =~ ^KDT-[A-Z]+-[0-9A-Za-z-]{6,40}$ ]] || { echo "$one  bad request_id"; continue; }
            BODY=$(jq -nc --arg r "$one" --arg s "$SVC" '{action:"verify", requestId:$r, service:$s}')
            code=$(curl -sS -m 90 -o out.json -w '%{http_code}' -X POST "$URL/functions/v1/clubkonnect" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -d "$BODY" || echo 000)
            v=$(jq -r '.status // "no-status"' out.json 2>/dev/null || echo unreadable)
            m=$(jq -r '.message // .error // empty' out.json 2>/dev/null | head -c 60 | tr -cd 'A-Za-z0-9 _:.,-')
            r=$(jq -r 'if (.reference // "") != "" then "ck-order-yes" else "ck-order-no" end' out.json 2>/dev/null || true)
            echo "CHECK $one  http=$code  verdict=$v  msg=$m  $r"
            # ClubKonnect's own record of the order, masked: any 7+ digit number keeps only its last 4 digits;
            # token / PIN / card fields are never printed.
            jq -r '(._raw // {}) | to_entries[]
                   | select(.key | test("token|pin|card|serial|epin"; "i") | not)
                   | "  ck." + .key + "=" + ((.value | tostring) | gsub("[0-9]{3,}(?<l>[0-9]{4})"; "***\(.l)"))' out.json 2>/dev/null | head -c 900 || true
          done
