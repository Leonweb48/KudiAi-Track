name: Demo reviewer account

# Manual only. Two fictional accounts (see scripts/demo-account/):
#   REVIEWER (Google Play's reviewers sign in with it)
#     create  — make it (if missing), set its password from the DEMO_REVIEWER_PASSWORD secret, fill it with fictional data
#     disable — lock it (random password + banned); use after the review
#   TESTER (free-plan account for trying "register in the Android app, upgrade elsewhere")
#     tester-create / tester-upgrade / tester-downgrade / tester-disable — password from the DEMO_TESTER_PASSWORD secret
# Passwords live ONLY in repository secrets — never in the repo or the logs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "reviewer: create / disable — tester: tester-create / tester-upgrade / tester-downgrade / tester-disable"
        type: choice
        options: [create, disable, tester-create, tester-upgrade, tester-downgrade, tester-disable]
        default: create

permissions:
  contents: read

concurrency:
  group: demo-account
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_REVIEWER_PASSWORD }}
          TESTER_PASSWORD: ${{ secrets.DEMO_TESTER_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: node scripts/demo-account/demo-account.mjs
