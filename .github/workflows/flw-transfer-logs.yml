name: Flutterwave transfer answers (logs)

# Read-only: Flutterwave's answers to our recent transfer requests, from the `flutterwave` function's own logs
# ("FLW disburse resp: <http> {...}"). CI logs are public: prints the time, HTTP status, Flutterwave's error code/type,
# its message with every 7+ digit run masked, and the transfer status — never the request (account number), names,
# amounts or references. Changes nothing.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How far back (max 24)"
        default: "12"

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Answers
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          HOURS: ${{ inputs.hours }}
        run: |
          set -uo pipefail
          H=$(( ${HOURS:-12} > 24 ? 24 : ${HOURS:-12} ))
          START=$(date -u -d "-$H hours" +%Y-%m-%dT%H:%M:%SZ); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="select timestamp, event_message from logs where source_name = 'function_logs' and event_message like '%FLW disburse resp%' order by timestamp desc limit 30"
          R=$(curl -s -m 60 -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
                -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$SQL" \
                --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END")
          echo "$R" | jq -r '.error // empty | tostring' | head -c 300
          echo "$R" | jq -r '.result[]? | [(.timestamp | tostring | .[0:19]), .event_message] | @tsv' | while IFS=$'\t' read -r T M; do
            HTTP=$(echo "$M" | grep -oE 'resp: [0-9]{3}' | grep -oE '[0-9]{3}')
            CODE=$(echo "$M" | grep -oE '"code":"?[A-Za-z0-9_]+' | head -1 | sed 's/.*:"\{0,1\}//')
            TYPE=$(echo "$M" | grep -oE '"type":"[A-Za-z_ ]+"' | head -2 | tr '\n' ' ')
            MSG=$(echo "$M" | grep -oE '"message":"[^"]{0,160}' | head -1 | sed 's/"message":"//' | sed -E 's/[0-9]{7,}/#/g')
            ST=$(echo "$M" | grep -oE '"status":"[A-Z_]+"' | head -1)
            echo "$T  http=$HTTP code=$CODE $TYPE $ST msg=$MSG"
          done
          echo "rows: $(echo "$R" | jq '.result | length' 2>/dev/null)"
          # counts only — tells a wrong query apart from no access / no logs
          for Q in "select source_name, count(*) as n from logs group by source_name" "select count(*) as n from logs where source_name = 'function_logs' and event_message like '%FLW%'" ; do
            C=$(curl -s -m 60 -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $TOKEN"                   --data-urlencode "sql=$Q" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END")
            echo "count [$Q]: $(echo "$C" | jq -c '.result // .error // .' | head -c 300)"
          done
