
name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Create Capacitor generated files
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          printf 'ext { }\n' > android/capacitor-cordova-android-plugins/cordova.variables.gradle

          mkdir -p android/app/src/main/assets
          printf '{"appId":"com.amayatechnologies.kuditrack","appName":"KudiAI Track","webDir":"build","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}\n' \
            > android/app/src/main/assets/capacitor.config.json
          printf '[]\n' > android/app/src/main/assets/capacitor.plugins.json

          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<widget id="com.amayatechnologies.kuditrack" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">\n</widget>\n' \
            > android/app/src/main/res/xml/config.xml

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r build/. android/app/src/main/assets/public/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KudiAI-Track-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      
      - name: Build debug APK
        run: |
         cd android
         ./gradlew assembleDebug --stacktrace
