name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          CI: false
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_PAYSTACK_PUBLIC_KEY: ${{ secrets.REACT_APP_PAYSTACK_PUBLIC_KEY }}
          REACT_APP_RECAPTCHA_SITE_KEY: 6Lcn6xEtAAAAAJgO5pBxFoqS2z25fSkhUodU1mqO
          REACT_APP_RECAPTCHA_V2_SITE_KEY: 6Lf18xEtAAAAAHtyNHK4eH3b99zuhPG63ELl7izq

      - name: Stamp build version into JS bundle
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_NUM=${{ github.run_number }}
          VERSION_STRING="${BUILD_DATE}-${BUILD_NUM}"
          echo "BUILD_VERSION=$VERSION_STRING" >> $GITHUB_ENV
          # Write version file that the app can read at runtime
          echo "{\"version\":\"$VERSION_STRING\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${{ github.sha }}\"}" > build/build-info.json
          echo "Stamped base bundle version: $VERSION_STRING"

      - name: Create Capacitor generated files
        run: |
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          mkdir -p android/capacitor-cordova-android-plugins/src/main/java
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/xml

          {
            echo "apply plugin: 'com.android.library'"
            echo "android {"
            echo "    namespace \"capacitor.cordova.android.plugins\""
            echo "    compileSdk rootProject.ext.compileSdkVersion"
            echo "    defaultConfig {"
            echo "        minSdkVersion rootProject.ext.minSdkVersion"
            echo "        targetSdkVersion rootProject.ext.targetSdkVersion"
            echo "    }"
            echo "}"
            echo "repositories {"
            echo "    mavenCentral()"
            echo "    google()"
            echo "    flatDir { dirs 'src/main/libs', '../app/libs' }"
            echo "}"
            echo "dependencies { }"
          } > android/capacitor-cordova-android-plugins/build.gradle

          echo 'ext { }' > android/capacitor-cordova-android-plugins/cordova.variables.gradle

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
            echo '</manifest>'
          } > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml

          echo '{"appId":"com.amayatechnologies.kuditrack","appName":"KudiAI Track","webDir":"build","server":{"androidScheme":"https"},"android":{"allowMixedContent":true},"plugins":{"StatusBar":{"overlaysWebView":true},"SplashScreen":{"launchShowDuration":1800,"backgroundColor":"#fdfefe","androidSplashResourceName":"splash","showSpinner":false,"splashFullScreen":true,"splashImmersive":true},"CapacitorUpdater":{"autoUpdate":"onlyDownload","updateUrl":"https://api.capgo.app/updates","statsUrl":"https://api.capgo.app/stats","channelUrl":"https://api.capgo.app/channel_self"},"PushNotifications":{"presentationOptions":[]}}}' > android/app/src/main/assets/capacitor.config.json
          echo '[{"pkg":"@capacitor-community/text-to-speech","classpath":"com.getcapacitor.community.tts.TextToSpeechPlugin"},{"pkg":"@capacitor/app","classpath":"com.capacitorjs.plugins.app.AppPlugin"},{"pkg":"@capacitor/browser","classpath":"com.capacitorjs.plugins.browser.BrowserPlugin"},{"pkg":"@capacitor/camera","classpath":"com.capacitorjs.plugins.camera.CameraPlugin"},{"pkg":"@capacitor/filesystem","classpath":"com.capacitorjs.plugins.filesystem.FilesystemPlugin"},{"pkg":"@capacitor/push-notifications","classpath":"com.capacitorjs.plugins.pushnotifications.PushNotificationsPlugin"},{"pkg":"@capacitor/share","classpath":"com.capacitorjs.plugins.share.SharePlugin"},{"pkg":"@capacitor/status-bar","classpath":"com.capacitorjs.plugins.statusbar.StatusBarPlugin"},{"pkg":"@capgo/capacitor-inappbrowser","classpath":"ee.forgr.capacitor_inappbrowser.InAppBrowserPlugin"},{"pkg":"@capgo/capacitor-updater","classpath":"ee.forgr.capacitor_updater.CapacitorUpdaterPlugin"}]' > android/app/src/main/assets/capacitor.plugins.json

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<widget id="com.amayatechnologies.kuditrack" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">'
            echo '</widget>'
          } > android/app/src/main/res/xml/config.xml

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r build/. android/app/src/main/assets/public/

      - name: Verify build-info.json is baked in
        run: |
          echo "=== Baked-in build-info.json ==="
          cat android/app/src/main/assets/public/build-info.json
          echo ""
          echo "=== JS bundle size ==="
          du -sh android/app/src/main/assets/public/static/js/

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # google-services.json is committed to the repo; this step lets a secret
      # override it (e.g. if keys rotate) without touching the committed file.
      - name: Write google-services.json from secret (if set)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" > android/app/google-services.json
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ── Release signing (uses ANDROID_KEYSTORE_BASE64 secret when set) ─────────
      # Always runs; writes keystore only if secret is non-empty.
      # Gradle falls back to debug signing automatically when ANDROID_KEYSTORE_FILE is unset.
      - name: Setup release signing
        env:
          KS_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS:     ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 --decode > android/app/kuditrack-release.keystore
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/android/app/kuditrack-release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"            >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KS_KEY_PASS"      >> $GITHUB_ENV
            echo "SIGNING_TYPE=RELEASE"                   >> $GITHUB_ENV
            echo "Keystore decoded — will sign with release keystore"
          else
            echo "SIGNING_TYPE=DEBUG" >> $GITHUB_ENV
            echo "No ANDROID_KEYSTORE_BASE64 secret — will use debug signing"
          fi

      - name: Build release APK
        run: |
          cd android
          BUILD_NUM=${{ github.run_number }}
          # Inject versionCode via Gradle property; keep versionName human-readable
          ./gradlew assembleRelease \
            -PversionCode=$BUILD_NUM \
            -PversionName="1.0.$BUILD_NUM" \
            --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "=== APK: $APK_PATH ==="
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)/apksigner verify --verbose "$APK_PATH" 2>&1 | head -10 || true
          echo ""
          echo "=== APK size ==="
          du -sh "$APK_PATH"
          echo ""
          if [ -n "${{ env.ANDROID_KEYSTORE_FILE }}" ]; then
            echo "=== Signed with: RELEASE keystore (consistent across builds) ==="
          else
            echo "=== Signed with: DEBUG keystore (add ANDROID_KEYSTORE_BASE64 secret for release signing) ==="
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KudiAI-Track-${{ env.BUILD_VERSION }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
