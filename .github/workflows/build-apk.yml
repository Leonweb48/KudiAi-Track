name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Write .env from secrets
        run: |
          echo "REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}"           > .env
          echo "REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}" >> .env
          echo "REACT_APP_PAYSTACK_PUBLIC_KEY=${{ secrets.REACT_APP_PAYSTACK_PUBLIC_KEY }}" >> .env
          echo "REACT_APP_OPENAI_API_KEY=${{ secrets.REACT_APP_OPENAI_API_KEY }}"       >> .env
          echo "REACT_APP_RECAPTCHA_V2_SITE_KEY=${{ secrets.REACT_APP_RECAPTCHA_V2_SITE_KEY }}" >> .env
          echo "RECAPTCHA_V2_SECRET_KEY=${{ secrets.RECAPTCHA_V2_SECRET_KEY }}"         >> .env

      - name: Build React app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Remove stale Android folder and scaffold fresh
        run: |
          rm -rf android
          npx cap add android

      - name: Write android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set app name to KudiAI Track
        run: |
          sed -i \
            -e 's|<string name="app_name">KudiTrack</string>|<string name="app_name">KudiAI Track</string>|' \
            -e 's|<string name="title_activity_main">KudiTrack</string>|<string name="title_activity_main">KudiAI Track</string>|' \
            android/app/src/main/res/values/strings.xml

      - name: Add deep-link intent filter
        run: |
          python3 - << 'PYEOF'
          import pathlib
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          deeplink = (
              "\n            <intent-filter android:autoVerify=\"true\">\n"
              "                <action android:name=\"android.intent.action.VIEW\" />\n"
              "                <category android:name=\"android.intent.category.DEFAULT\" />\n"
              "                <category android:name=\"android.intent.category.BROWSABLE\" />\n"
              "                <data android:scheme=\"com.amayatechnologies.kuditrack\" />\n"
              "            </intent-filter>"
          )
          updated = content.replace("</intent-filter>", "</intent-filter>" + deeplink, 1)
          manifest.write_text(updated)
          print("Deep link injected")
          PYEOF

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Resize and copy app icon
        run: |
          python3 - << 'PYEOF'
          from PIL import Image
          import pathlib
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          img = Image.open("public/logo.png").convert("RGBA")
          for folder, px in sizes.items():
              dest = pathlib.Path(f"android/app/src/main/res/{folder}")
              dest.mkdir(parents=True, exist_ok=True)
              r = img.resize((px, px), Image.LANCZOS)
              r.save(dest / "ic_launcher.png")
              r.save(dest / "ic_launcher_round.png")
          print("Icons written")
          PYEOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KudiAI-Track-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
