name: ClubKonnect credentials test

# Free, nothing bought: a VALID MTN airtime order ClubKonnect cannot pay for (wallet balance + N5,000, to the account's
# own number) sent at the same moment from our bill server (ck-variants mode "insufficient") and from this GitHub
# runner. Accepted login → INSUFFICIENT_BALANCE; rejected login → INVALID_CREDENTIALS. Also compares short SHA-256
# fingerprints of the key / UserID on the server with the CK_API_KEY secret. Prints statuses and fingerprints only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1 (pinned)
        with:
          version: 2.107.0
      - name: Test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          CK_KEY: ${{ secrets.CK_API_KEY }}
        run: |
          set -uo pipefail
          CK_KEY=$(printf '%s' "$CK_KEY" | tr -d '[:space:]')   # a pasted key often carries a newline or spaces
          FN="https://${REF}.supabase.co/functions/v1/clubkonnect"
          SRK=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SRK"
          UID_=$(curl -sS -m 90 -X POST "$FN" -H "Content-Type: application/json" -H "Authorization: Bearer $SRK" -d '{"action":"ck-variants","includeUser":true}' | jq -r '.userId // empty')
          [ -n "$UID_" ] && echo "::add-mask::$UID_"
          fp() { printf '%s' "$1" | sha256sum | cut -c1-12; }
          echo "FROM OUR BILL SERVER: $(curl -sS -m 90 -X POST "$FN" -H "Content-Type: application/json" -H "Authorization: Bearer $SRK" -d '{"action":"ck-variants","mode":"insufficient"}')"
          echo "GITHUB SECRET CK_API_KEY fingerprint: $(fp "$CK_KEY")   UserID fingerprint: $(fp "$UID_")"
          BAL=$(curl -sS -m 20 "https://www.nellobytesystems.com/APIWalletBalanceV1.asp?UserID=$UID_&APIKey=$CK_KEY")
          PHONE=$(echo "$BAL" | jq -r '.phoneno // empty'); [ -n "$PHONE" ] && echo "::add-mask::$PHONE"
          B=$(echo "$BAL" | jq -r '(.balance // .Balance // .WalletBalance // "") | tostring | gsub(","; "")')
          [ -n "$B" ] && [ -n "$PHONE" ] || { echo "FROM GITHUB: could not read the balance / number"; exit 0; }
          AMT=$(awk -v b="$B" 'BEGIN { a = int((b + 5000 + 99) / 100) * 100; print a }')
          [ "$AMT" -le 49000 ] || { echo "FROM GITHUB: skipped (balance too high for a safe unpayable order)"; exit 0; }
          R=$(curl -sS -m 30 -w '\n%{http_code}' "https://www.nellobytesystems.com/APIAirtimeV1.asp?UserID=$UID_&APIKey=$CK_KEY&MobileNetwork=01&Amount=$AMT&MobileNumber=$PHONE&RequestID=KDT-PROBE-GH-$(date +%s)&CallBackURL=https%3A%2F%2Fkudiai.app%2F")
          CODE=$(echo "$R" | tail -1); BODY=$(echo "$R" | sed '$d')
          S=$(echo "$BODY" | jq -r '.status // .Status // empty' 2>/dev/null); [ -n "$S" ] || S="page: $(echo "$BODY" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | cut -c1-60)"
          echo "FROM GITHUB (IP $(curl -s -m 10 https://api.ipify.org || echo ?)): HTTP $CODE $S   (amount rule: balance + N5,000)"
