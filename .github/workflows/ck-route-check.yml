name: ClubKonnect route check

# Read-only and free. Calls the clubkonnect function's service-only `route-check` action, which reports:
#   • canary   — is each main (V1) and backup (V3) purchase script up? (probed with a made-up account, never ours)
#   • dryRun   — a ₦1 airtime order (below ClubKonnect's ₦50 minimum, so refused, nothing placed) on V1 and V3 with
#                OUR account: shows whether each route accepts our credentials and parameter names
#   • lookup   — the order lookup's reply for an order that can't exist: the "no such order" answer the fallback relies on
#   • config   — the live routing switches
# Prints statuses and field names only — never keys, customer data or amounts.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1 (pinned)
        with:
          version: 2.107.0

      - name: Route check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          FN="https://${REF}.supabase.co/functions/v1/clubkonnect"
          SRK=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SRK"
          curl -sS -m 120 -X POST "$FN" -H "Content-Type: application/json" -H "Authorization: Bearer $SRK" \
            -d '{"action":"route-check"}' > out.json || true
          echo "CANARY $(jq -c '.canary' out.json)"
          echo "DRYRUN $(jq -c '.dryRun' out.json)"
          echo "LOOKUP $(jq -c '.lookup' out.json)"
          echo "CONFIG $(jq -c '.config' out.json)"
          echo "ERROR  $(jq -c '.error // empty' out.json)"
