name: Apply Verification Schema

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Apply the verification schema SQL directly via Supabase Management API.
      # This avoids migration-history conflicts with older untracked migrations.
      - name: Apply verification schema via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          SQL=$(cat supabase/migrations/20260807000000_verification_schema.sql)
          PAYLOAD=$(jq -n --arg q "$SQL" '{"query": $q}')

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Verification schema applied successfully"
          else
            echo "❌ Failed to apply schema (HTTP $HTTP_CODE)"
            exit 1
          fi
